name = "wenming-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# 允許呼叫的網站來源（逗號分隔）。GitHub Pages 上線後若網域不同，改這裡。
ALLOWED_ORIGINS = "https://gxgemini777.github.io,https://dhoper.github.io,http://127.0.0.1:8765,http://localhost:8765"
USER_READINGS = "10"
USER_ASKS = "30"
SITE_CALLS = "400"

# 每日次數已改記在 D1 的 counters 表（原子遞增）；舊的 KV（LIMITS）不再使用

# D1：分享卡（cards，存 30 天）與每日次數（counters）
[[d1_databases]]
binding = "CARDS"
database_name = "wenming-cards"
database_id = "b8287a10-3487-495f-95de-730ffde55941"
