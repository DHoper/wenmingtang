name = "wenming-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# 允許呼叫的網站來源（逗號分隔）。GitHub Pages 上線後若網域不同，改這裡。
ALLOWED_ORIGINS = "https://gxgemini777.github.io,https://dhoper.github.io,http://127.0.0.1:8765,http://localhost:8765"
USER_READINGS = "3"
USER_ASKS = "9"
SITE_CALLS = "400"

[[kv_namespaces]]
binding = "LIMITS"
id = "b4181e77e0c44e28adeeeeca175e77a2"

# 分享卡：每次分享把預覽圖存在這裡 30 天，朋友在 LINE／臉書看到的連結預覽就是這張圖
[[d1_databases]]
binding = "CARDS"
database_name = "wenming-cards"
database_id = "b8287a10-3487-495f-95de-730ffde55941"
